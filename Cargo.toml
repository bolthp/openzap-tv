[package]
name = "openzap"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "system_fonts", "wayland", "web_screen_reader", "x11"] }
# Not a new crate (eframe already uses egui): only turns on the bundled
# monochrome icon fonts, so symbols like ⏹ 🔊 ⛶ look the same everywhere.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.10"
# Gamepads on Linux (evdev; also inside the Flatpak), Windows and macOS,
# with SDL's mapping database so pads from many makers name their buttons
# right. Linux builds need libudev (`libudev-dev`).
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libloading = "0.9.0"
quick-xml = "0.42.0"
rfd = "0.17"
ureq = "3.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
winresource = "0.1.34"
