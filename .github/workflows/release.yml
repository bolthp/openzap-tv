name: Release

# Publishes a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Running it by hand (Actions -> Release -> Run workflow) builds the
# archives as a dry run: they are kept as workflow artifacts, nothing is
# published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Older Ubuntu on purpose: the binary then runs on more distributions
          # (it needs glibc at least as new as the build machine's).
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Version (tag must match Cargo.toml and the metainfo)
        shell: bash
        run: echo "RELEASE_NAME=$(scripts/release-name.sh)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="openzap-${RELEASE_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/openzap LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "openzap-$env:RELEASE_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/openzap.exe, scripts/openzap-debug.bat, LICENSE, README.md $name
          ./scripts/fetch-libmpv-windows.ps1 -Dest $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # On a plain runner: the Flatpak container's Python could not set up the
  # generator's modules.
  cargo-sources:
    name: Flatpak cargo sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/flatpak-cargo-sources.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-sources
          path: flatpak/cargo-sources.json
          if-no-files-found: error

  flatpak:
    name: Build (flatpak-x86_64)
    needs: cargo-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Version (tag must match Cargo.toml and the metainfo)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "RELEASE_NAME=$(scripts/release-name.sh)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: cargo-sources
          path: flatpak

      # Builds libmpv and FFmpeg too; the cache keeps them between releases.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.bolthp.OpenZap.yml
          bundle: openzap-${{ env.RELEASE_NAME }}-x86_64.flatpak
          cache-key: flatpak-${{ hashFiles('flatpak/io.github.bolthp.OpenZap.yml') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-x86_64
          path: openzap-${{ env.RELEASE_NAME }}-x86_64.flatpak
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, flatpak]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*-x86_64"
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
