name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tests that need libmpv must fail, not skip, when it is missing.
  OPENZAP_REQUIRE_MPV: "1"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libwayland-dev libxkbcommon-dev

      - name: Fetch libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv-windows.ps1 -Dest "$env:RUNNER_TEMP/libmpv"
          # LoadLibrary also searches PATH, which is how the test binaries find it.
          "$env:RUNNER_TEMP/libmpv" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
